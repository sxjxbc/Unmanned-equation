# Operator-authorized short test. Policy values below are NOT measured dynamics.
vehicle_output: false  # Planner never sends; separate output node sends the original protocol.
control_mode: legacy_compatible
boundary_mode: inferred_low_speed_trial
trial_permission: true
ready_frames: 10
candidate_hold: 0.5
execution_steering_sign: -1  # Source-code Y-right to Y-left basis mapping.
coordinates:
  localization_reference: confirmed_imu
  convention_confirmed: true  # Reuse original mapper conventions, not new physical calibration.
  rear_in_imu: [-0.463, 0.010]
  input_map_frame: map
  map_frame: trackdrive_map
  cones_frame: /velodyne
  lidar_offset_x: 1.76618
  lidar_offset_y: -0.11304
  lidar_y_sign: -1
  lidar_yaw_offset_deg: 0.5
vehicle:
  pose_reference: rear_axle
  geometry_mode: rear_axle_rectangle
  wheelbase: 1.55
  front: 2.22918 # Conditional on user-authorized lidar-center-at-front assumption.
  rear: 0.70082
  width: 1.4 # Symmetric body about rear axle centerline assumed.
  margin: 0.10
  max_steer: 0.5 # Original software bound, not a measured wheel limit.
  steer_rate: 0.24 # Original 0.012 rad/20Hz cycle.
  speed_cap: 1.0 # GPS estimate only. Onsite operator controls actual speed.
  lateral_accel: 0.5 # Conservative trial policy assumptions.
  brake: 0.5
  latency: 0.3
  stop_margin: 0.5
