# tracking_udp_v1.2.py 参数

# 位姿话题：仿真用 /vehicle_pose_gt，实车用 /vehicle_pose
pose_topic: /vehicle_pose

# 前轮最大转角（rad）。默认 pi/2 等于不限幅，
# 实车按标定值填，例如 math.radians(30) ≈ 0.524
steer_max_rad: 0.524

# 纯跟踪参数
kp_steer: 0.75
lookahead_min: 2.5
lookahead_max: 6.0
lookahead_gain: 1.0

# 轮半径（m）。Hoosier 43105 RB 实测后改
wheel_radius: 0.3

# 最大轮速 RPM
rpm_max: 3000

# 初始位置（前悬修正后）
start_x: -15.7
start_y: 0.0